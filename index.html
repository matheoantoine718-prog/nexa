/* =========================================================
   NEXA V4 — UI EVOLUTION
   Design System
========================================================= */

:root {

    --bg: #050507;
    --surface: #101014;
    --surface-2: #0c0c0f;

    --border: #24242b;
    --border-soft: #29292f;

    --text: #ffffff;
    --text-soft: #aaa;
    --text-muted: #777;
    --text-dim: #555;

    --black: #000;
    --white: #fff;

    --success: #d9ffd9;
    --warning: #fff3c4;
    --danger: #ffd6d6;

    --s-1: 10px;
    --s-2: 14px;
    --s-3: 18px;
    --s-4: 22px;
    --s-5: 25px;
    --s-6: 35px;
    --s-7: 40px;
    --s-8: 45px;

    --r-sm: 14px;
    --r-lg: 22px;
    --r-full: 50%;

    --shadow:
        0 0 30px rgba(255,255,255,0.15),
        0 0 100px rgba(255,255,255,0.05);

    --font:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        sans-serif;

    --transition:
        220ms cubic-bezier(.2,.8,.2,1);

}


/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}


html {
    min-height: 100%;
    background: var(--bg);
}


body {

    font-family: var(--font);

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(255,255,255,.035),
            transparent 35%
        ),
        var(--bg);

    color: var(--text);

    min-height: 100vh;

    overflow-x: hidden;

    -webkit-font-smoothing: antialiased;

}


button,
textarea {

    font-family: inherit;

}


/* =========================================================
   APP
========================================================= */

.container {

    width: 100%;

    max-width: 600px;

    margin: auto;

    min-height: 100vh;

    padding:
        var(--s-5)
        var(--s-3)
        40px;

    display: flex;

    flex-direction: column;

}


/* =========================================================
   HEADER
========================================================= */

header {

    display: flex;

    justify-content: space-between;

    align-items: center;

}


.logo {

    font-size: 22px;

    font-weight: 700;

    letter-spacing: 5px;

}


.status {

    font-size: 10px;

    color: var(--text-muted);

    letter-spacing: 2px;

    display: flex;

    align-items: center;

    gap: 7px;

}


.status-dot {

    width: 6px;

    height: 6px;

    border-radius: 50%;

    background: #777;

    box-shadow:
        0 0 8px rgba(255,255,255,.2);

}


/* =========================================================
   HERO
========================================================= */

.hero {

    flex: 1;

    display: flex;

    flex-direction: column;

    justify-content: center;

    padding:
        var(--s-7)
        0;

}


/* =========================================================
   ORB
========================================================= */

.orb-wrapper {

    position: relative;

    width: 120px;

    height: 120px;

    margin:
        0 auto
        var(--s-8);

    display: flex;

    justify-content: center;

    align-items: center;

}


.orb-glow {

    position: absolute;

    width: 110px;

    height: 110px;

    border-radius: var(--r-full);

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.08),
            transparent 70%
        );

    filter: blur(10px);

    animation:
        glow 4s infinite ease-in-out;

}


.orb {

    position: relative;

    width: 82px;

    height: 82px;

    border-radius: var(--r-full);

    background:
        radial-gradient(
            circle at 35% 30%,
            #ffffff,
            #999 18%,
            #444 42%,
            #151515 68%,
            #070707 100%
        );

    box-shadow: var(--shadow);

    animation:
        breathe 4s infinite ease-in-out;

    transition:
        transform .5s ease,
        filter .5s ease;

}


.orb::after {

    content: "";

    position: absolute;

    inset: 2px;

    border-radius: inherit;

    border:
        1px solid
        rgba(255,255,255,.12);

}


@keyframes breathe {

    0%,
    100% {

        transform: scale(1);

        opacity: .82;

    }

    50% {

        transform: scale(1.08);

        opacity: 1;

    }

}


@keyframes glow {

    0%,
    100% {

        transform: scale(.9);

        opacity: .35;

    }

    50% {

        transform: scale(1.15);

        opacity: .7;

    }

}


/* =========================================================
   ORB STATES
========================================================= */

body.state-like .orb {

    transform: scale(1.12);

    filter:
        brightness(1.15);

}


body.state-like .orb-glow {

    animation:
        pulseLike .8s ease;

}


body.state-later .orb {

    transform: scale(.95);

    filter:
        brightness(.8);

}


body.state-no .orb {

    transform: scale(.88);

    filter:
        brightness(.65);

}


@keyframes pulseLike {

    0% {

        transform: scale(1);

        opacity: .3;

    }

    50% {

        transform: scale(1.4);

        opacity: .9;

    }

    100% {

        transform: scale(1);

        opacity: .3;

    }

}


/* =========================================================
   TYPOGRAPHY
========================================================= */

.title {

    text-align: center;

    font-size: clamp(
        29px,
        8vw,
        36px
    );

    font-weight: 600;

    line-height: 1.15;

    letter-spacing: -.7px;

    margin-bottom:
        var(--s-2);

}


.subtitle {

    text-align: center;

    color: var(--text-muted);

    font-size: 15px;

    line-height: 1.5;

    margin-bottom:
        var(--s-6);

}


/* =========================================================
   INPUT
========================================================= */

.input-box {

    background:
        rgba(16,16,20,.92);

    border:
        1px solid
        var(--border);

    border-radius:
        var(--r-lg);

    padding:
        var(--s-3);

    transition:
        border var(--transition),
        box-shadow var(--transition),
        transform var(--transition);

}


.input-box:focus-within {

    border-color:
        #444;

    box-shadow:
        0 0 0 1px rgba(255,255,255,.025),
        0 20px 60px rgba(0,0,0,.25);

}


textarea {

    width: 100%;

    height: 110px;

    resize: none;

    border: none;

    outline: none;

    background:
        transparent;

    color:
        var(--text);

    font-size:
        17px;

    line-height:
        1.5;

}


textarea::placeholder {

    color:
        var(--text-dim);

}


/* =========================================================
   PRIMARY BUTTON
========================================================= */

.discover {

    width: 100%;

    margin-top:
        var(--s-2);

    padding:
        var(--s-3);

    border: none;

    border-radius:
        var(--r-sm);

    background:
        var(--white);

    color:
        var(--black);

    font-size:
        16px;

    font-weight:
        600;

    cursor:
        pointer;

    transition:
        transform var(--transition),
        opacity var(--transition);

}


.discover:active {

    transform:
        scale(.97);

    opacity:
        .85;

}


/* =========================================================
   PROGRESS BUTTON
========================================================= */

.progress-button {

    width: 100%;

    margin-top:
        var(--s-2);

    padding:
        var(--s-2);

    border-radius:
        var(--r-sm);

    border:
        1px solid
        var(--border-soft);

    background:
        var(--surface-2);

    color:
        var(--text-soft);

    font-size:
        14px;

    cursor:
        pointer;

    transition:
        background var(--transition),
        border var(--transition);

}


.progress-button:active {

    background:
        var(--surface);

}


/* =========================================================
   RESULT
========================================================= */

.result,
.progress-view {

    display:
        none;

    animation:
        appear .45s ease;

}


@keyframes appear {

    from {

        opacity: 0;

        transform:
            translateY(18px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


.result-label {

    color:
        var(--text-muted);

    font-size:
        10px;

    letter-spacing:
        3px;

    margin-bottom:
        var(--s-2);

}


.result h2 {

    font-size:
        28px;

    line-height:
        1.2;

    letter-spacing:
        -.4px;

    margin-bottom:
        var(--s-4);

}


/* =========================================================
   RESULT CARD
========================================================= */

.result-card {

    position:
        relative;

    background:
        linear-gradient(
            145deg,
            rgba(16,16,20,.98),
            rgba(10,10,13,.98)

    border:
        1px solid
        var(--border);

    border-radius:
        var(--r-lg);

    padding:
        var(--s-4);

    margin-bottom:
        var(--s-4);

    overflow:
        hidden;

}


.result-card::before {

    content:

    position:
        absolute;

    top:
        0;

    left:
        0;

    width:
        100%;

    height:
        1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.15),

.result-card p {

    color:
        var(--text-soft);

    line-height:
        1.65;

    font-size:
        16px;

}


/* =========================================================
   ACTIONS
========================================================= */

.actions {

    display:
        grid;

    grid-template-columns:
        1fr 1fr;

    gap:
        var(--s-1);

}


.action {

    min-height:

    padding:

    border-radius:
        var(--r-sm);

    border:
        1px solid
        var(--border-soft);

    background:
        var(--surface-2);

    color:
        var(--text);

    font-size:
        14px;

    cursor:
        pointer;

    transition:
        transform var(--transition),

.action:active {

}


.action.full {

}


/* =========================================================
   META
========================================================= */

.progress {

    color:

    font-size:
        10px;

    letter-spacing:
        1.5px;

.feedback-message {

    text-align:

    min-height:
        20px;

    margin-top:
        var(--s-2);

    color:
        var(--text-muted);

    font-size:
        12px;

/* =========================================================
   PROGRESS VIEW
========================================================= */

.progress-view h2 {

    font-size:
        30px;

    margin-bottom:
        var(--s-4);

}


.progress-card {

    background:
        var(--surface);

    border:
        1px solid
        var(--border);

    border-radius:
        var(--r-lg);

    padding:
        var(--s-3);

    margin-bottom:
        var(--s-4);

.stat {

    border-bottom:
        1px solid
        var(--border);

}


.stat:first-child {

    padding-top:
        var(--s-2);

}


.stat:last-child {

    border-bottom:
        none;

}


.stat-label {

    color:
        var(--text-muted);

    font-size:
        10px;

    letter-spacing:
        2px;

.stat-value {

    margin-top:
        6px;

    font-size:
        17px;

    line-height:
        1.4;

}


/* =========================================================
   LEVEL BAR
========================================================= */

.level-bar {

    height:
        5px;

    width:
        100%;

    margin-top:
        10px;

    border-radius:
        10px;

    background:
        #202025;

    overflow:
        hidden;

.level-fill {

    height:

    width:
        20%;

    background:
        #fff;

    border-radius:
        inherit;

    transition:
        width .5s ease;

/* =========================================================
   BACK BUTTON
========================================================= */

.back-button {

        var(--s-2);

    border-radius:
        var(--r-sm);

        1px solid

        var(--white);

/* =========================================================

footer {

    text-align:

        10px;

        var(--s-4);

/* =========================================================

========================================================= */

@media (

    }

    .title {

        font-size:
            28px;

    }

    .result h2 {

        font-size:
            25px;

    }

</style>

const lower =
input.toLowerCase();


let scores = {

argent: 0,

business: 0,

projet: 0,

apprentissage: 0,

blocage: 0

};

lower.includes(word)

scores[category]++;

}


});

0;

const category in scores
) {


if (
scores[category] > score
) {


score =
scores[category];


best =
category;


}

}


return best;

/* =========================================================
   TITLES
========================================================= */

function getTitle(category, mode) {


if (
mode === "light"
) {

return "On peut commencer plus simplement.";

}


if (
mode === "alternative"
) {

return "Essayons une autre direction.";

}


const titles = {


emploi:
"Explore une possibilité qui pourrait améliorer ta situation.",

argent:
"Trouve une possibilité concrète d'améliorer tes revenus.",

business:
"Ton idée mérite un premier test.",

projet:
"Transforme ton idée en une première étape concrète.",

apprentissage:
"Découvre une nouvelle compétence.",

blocage:
"Réduis ton blocage à une seule petite action.",

general:
"Commence par une petite découverte."

};


return (
titles[category]
||
titles.general
);

}


/* =========================================================
   DISCOVER
========================================================= */

function discover() {


const input =
document
.getElementById("userInput")
.value
.trim();


if (!input) {


alert(
"Dis-moi simplement ce que tu as en tête."
);


return;

}


/* Detect */

let category =
detectCategory(input);


/* New direction */

if (
session.category !== category
) {


session.category =
category;


session.level =
1;


session.likes =
0;


session.later =
0;


session.no =
0;


session.positiveActions =
0;


session.nextMode =
"normal";


}


/* Mode */

let mode =
session.nextMode
||
"normal";


/* Actions */

let list =
actions[category]
||
actions.general;


let actionList =
list[mode]
||
list.normal;


/* Level */

let index =
Math.min(
session.level - 1,
actionList.length - 1
);


let action =
actionList[index];


/* Save current */

session.lastAction =
action;


memory.push({


text:
input,


category:
category,


level:
session.level,


mode:
mode,


action:
action,


feedback:
null,


date:
new Date()
.toISOString()


});


localStorage.setItem(

"nexaMemory",

JSON.stringify(memory)

);


localStorage.setItem(

"nexaSession",

JSON.stringify(session)

);


/* UI */

document
.getElementById("resultTitle")
.innerText =
getTitle(
category,
mode
);


document
.getElementById("resultText")
.innerText =
action;


document
.getElementById("progressText")
.innerText =

"NIVEAU " +
session.level +
" • " +
category.toUpperCase();


document
.getElementById("feedbackMessage")
.innerText =
"";


document
.getElementById("home")
.style
.display =
"none";


document
.getElementById("progressView")
.style
.display =
"none";


document
.getElementById("result")
.style
.display =
"block";


window.scrollTo({

top: 0,

behavior:
"smooth"

});


}


/* =========================================================
   FEEDBACK
========================================================= */

function feedback(type) {


const last =
memory[
memory.length - 1
];


if (!last) {

return;

}


last.feedback =
type;


/* =========================================
   LIKE
========================================= */

if (
type === "like"
) {


session.likes++;


session.positiveActions++;


session.level =
Math.min(
session.level + 1,
5
);


session.nextMode =
"normal";


document.body
.className =
"state-like";


document
.getElementById("feedbackMessage")
.innerText =
"Très bien. On avance.";


}


/* =========================================
   LATER
========================================= */

if (
type === "later"
) {


session.later++;


session.nextMode =
"light";


document.body
.className =
"state-later";


document
.getElementById("feedbackMessage")
.innerText =
"On peut avancer plus doucement.";


}


/* =========================================
   NO
========================================= */

if (
type === "no"
) {


session.no++;


session.nextMode =
"alternative";


document.body
.className =
"state-no";


document
.getElementById("feedbackMessage")
.innerText =
"Compris. Essayons une autre direction.";


}


/* Save */

last.nextLevel =
session.level;


last.nextMode =
session.nextMode;


localStorage.setItem(

"nexaMemory",

JSON.stringify(memory)

);


localStorage.setItem(

"nexaSession",

JSON.stringify(session)

);


/* Return home */

setTimeout(
function() {


document
.getElementById("result")
.style
.display =
"none";


document
.getElementById("home")
.style
.display =
"block";


document
.getElementById("userInput")
.value =
"";


document.body
.className =
"";


window.scrollTo({

top: 0,

behavior:
"smooth"

});


},
350
);

}


/* =========================================================
   PROGRESS
========================================================= */

function showProgress() {


document
.getElementById("home")
.style
.display =
"none";


document
.getElementById("result")
.style
.display =
"none";


document
.getElementById("progressView")
.style
.display =
"block";


document
.getElementById("statCategory")
.innerText =

session.category
?
session.category.toUpperCase()
:
"Aucune";


document
.getElementById("statLevel")
.innerText =

"Niveau " +
session.level;


document
.getElementById("statLikes")
.innerText =

session.likes;


document
.getElementById("statActions")
.innerText =

session.positiveActions;


document
.getElementById("statLast")
.innerText =

session.lastAction
?
session.lastAction
:
"Aucune";


let percentage =

(
session.level /
5
)
*
100;


document
.getElementById("levelFill")
.style
.width =

percentage +
"%";


window.scrollTo({

top: 0,

behavior:
"smooth"

);

}


/* =========================================================
   HOME
========================================================= */

function goHome() {


document
.getElementById("progressView")
.style
.display =
"none";


document
.getElementById("result")
.style
.display =
"none";


document
.getElementById("home")
.style
.display =
"block";


window.scrollTo({

top: 0,

behavior:
"smooth"

);

}


/* =========================================================
   ENTER KEY
========================================================= */

document
.getElementById("userInput")
.addEventListener(
"keydown",
function(event) {


if (
event.key === "Enter"
&&
!event.shiftKey
) {


event.preventDefault();


discover();


}

}
);


/* =========================================================
   INITIAL STATE
========================================================= */

document.body
.className =
"";


</script>
