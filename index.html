<style>

/* =========================
   DESIGN SYSTEM (CLEAN)
========================= */

:root {

    /* COLORS */
    --bg: #050507;
    --surface: #101014;
    --surface-2: #0c0c0f;

    --border: #24242b;
    --border-soft: #29292f;

    --text: #ffffff;
    --text-muted: #777;
    --text-dim: #555;
    --text-soft: #aaa;

    --black: #000;
    --white: #fff;

    /* SPACING (SIMPLIFIED SCALE) */
    --s-1: 10px;
    --s-2: 14px;
    --s-3: 18px;
    --s-4: 22px;
    --s-5: 25px;
    --s-6: 35px;
    --s-7: 40px;
    --s-8: 45px;

    /* RADIUS (REDUCED SET) */
    --r-sm: 14px;
    --r-lg: 22px;
    --r-full: 50%;

    /* SHADOW (MERGED) */
    --shadow: 0 0 30px rgba(255,255,255,0.15),
              0 0 100px rgba(255,255,255,0.05);

    /* TYPO */
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
}

/* =========================
   BASE
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 600px;
    margin: auto;
    min-height: 100vh;
    padding: var(--s-5) var(--s-3) 40px;
    display: flex;
    flex-direction: column;
}

/* =========================
   HEADER
========================= */

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 5px;
}

.status {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 2px;
}

/* =========================
   HERO
========================= */

.hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: var(--s-7) 0;
}

.orb {
    width: 90px;
    height: 90px;
    margin: 0 auto var(--s-8);
    border-radius: var(--r-full);

    background: radial-gradient(
        circle at 35% 30%,
        #ffffff,
        #777 20%,
        #222 50%,
        #080808 70%
    );

    box-shadow: var(--shadow);

    animation: breathe 4s infinite ease-in-out;
}

@keyframes breathe {
    0%,100% { transform: scale(1); opacity: .8; }
    50% { transform: scale(1.08); opacity: 1; }
}

.title {
    text-align: center;
    font-size: 32px;
    font-weight: 600;
    line-height: 1.2;
    margin-bottom: var(--s-2);
}

.subtitle {
    text-align: center;
    color: var(--text-muted);
    font-size: 15px;
    margin-bottom: var(--s-6);
}

/* =========================
   INPUT
========================= */

.input-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: var(--s-3);
}

textarea {
    width: 100%;
    height: 110px;
    resize: none;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 17px;
    font-family: inherit;
}

textarea::placeholder {
    color: var(--text-dim);
}

/* =========================
   BUTTONS
========================= */

.discover {
    width: 100%;
    margin-top: var(--s-2);
    padding: var(--s-3);
    border: none;
    border-radius: var(--r-sm);
    background: var(--white);
    color: var(--black);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}

.progress-button {
    width: 100%;
    margin-top: var(--s-2);
    padding: var(--s-2);
    border-radius: var(--r-sm);
    border: 1px solid var(--border-soft);
    background: var(--surface-2);
    color: var(--text-soft);
    font-size: 14px;
}

/* =========================
   RESULT
========================= */

.result,
.progress-view {
    display: none;
    animation: appear .5s ease;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.result-label {
    color: var(--text-muted);
    font-size: 11px;
    letter-spacing: 3px;
    margin-bottom: var(--s-2);
}

.result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: var(--s-4);
    margin-bottom: var(--s-4);
}

.result-card p {
    color: var(--text-soft);
    line-height: 1.6;
    font-size: 15px;
}

/* =========================
   ACTIONS
========================= */

.actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--s-1);
}

.action {
    padding: var(--s-2);
    border-radius: var(--r-sm);
    border: 1px solid var(--border-soft);
    background: var(--surface-2);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
}

.action.full {
    grid-column: span 2;
}

/* =========================
   PROGRESS
========================= */

.progress {
    margin-top: var(--s-4);
    text-align: center;
    color: var(--text-dim);
    font-size: 11px;
}

.stat {
    padding: var(--s-2) 0;
    border-bottom: 1px solid var(--border);
}

.stat-label {
    color: var(--text-muted);
    font-size: 11px;
    letter-spacing: 2px;
}

.stat-value {
    margin-top: 6px;
    font-size: 18px;
}

/* =========================
   BACK
========================= */

.back-button {
    width: 100%;
    padding: var(--s-2);
    border-radius: var(--r-sm);
    border: 1px solid var(--border-soft);
    background: var(--white);
    color: var(--black);
    font-size: 15px;
}

/* =========================
   FOOTER
========================= */

footer {
    text-align: center;
    color: #444;
    font-size: 11px;
    letter-spacing: 1px;
    padding-top: var(--s-4);
}

</style>
